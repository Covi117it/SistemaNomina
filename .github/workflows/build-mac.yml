name: Build macOS Release & Auto-Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version 10.0.110
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build .NET Backend for macOS
        run: |
          cd backend
          $HOME/.dotnet/dotnet publish -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true

      - name: Build Tauri App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./sistema-nomina"
          tagName: ${{ github.ref_name }}
          releaseName: "SistemaNomina ${{ github.ref_name }}"
          releaseBody: "Actualización automática de Sistema Nómina"
          draft: false
          prerelease: false
