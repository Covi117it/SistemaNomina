name: Build macOS Release & Auto-Update

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version 10.0.110
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build .NET Backend for macOS
        run: |
          cd backend
          $HOME/.dotnet/dotnet publish -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true

      - name: Build Tauri Desktop App (.dmg)
        run: |
          cd sistema-nomina
          pnpm install
          pnpm tauri build

      - name: Upload macOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SistemaNomina-macOS
          path: |
            sistema-nomina/src-tauri/target/release/bundle/dmg/*.dmg
            sistema-nomina/src-tauri/target/release/bundle/macos/*.app
